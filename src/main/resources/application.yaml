spring:
  application:
    name: spring-docs-agent
  # Local dev database from compose.yaml (docker-compose up -d). Tests use Testcontainers instead.
  mvc:
    problemdetails:
      enabled: true   # RFC 9457 error bodies
  datasource:
    url: jdbc:postgresql://localhost:5433/docsagent
    username: docsagent
    password: docsagent
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false   # Flyway owns the schema (V1__vector_store.sql)
        schema-validation: true    # fail at startup if the table doesn't match what PgVectorStore expects
        dimensions: 384
        index-type: hnsw
        distance-type: cosine_distance

docsagent:
  anthropic:
    # ANTHROPIC_API_KEY is read by the SDK from the environment, never from Spring config.
    agent-model: claude-sonnet-5-5
    agent-effort: medium
    agent-max-tokens: 10000
    helper-model: claude-haiku-5-5
    timeout: 60s
    max-retries: 2
  agent:
    max-turns: 10
    max-total-tokens: 200000
    max-cost-usd: 0.50
    run-timeout: 2m
  # USD per million tokens (Claude API list prices, checked 2026-10-12). Cache write = 5-minute TTL (1.25x input).
  pricing:
    models:
      claude-sonnet-5-5:
        input-per-mtok: 2.00
        output-per-mtok: 10.00
        cache-write-per-mtok: 2.50
        cache-read-per-mtok: 0.20
      claude-haiku-5-5:
        input-per-mtok: 0.10
        output-per-mtok: 0.50
        cache-write-per-mtok: 0.125
        cache-read-per-mtok: 0.01
  docs:
    raw-base-url: https://raw.githubusercontent.com/spring-projects/spring-boot
    tag: v4.1.1
    boot-version: 4.1.1
    site-base-url: https://docs.spring.io/spring-boot/4.1/reference
    # M1 subset: the "Testing" and "Data" sections of the reference guide
    pages:
      - testing/index
      - testing/test-scope-dependencies
      - testing/spring-applications
      - testing/spring-boot-applications
      - testing/testcontainers
      - testing/test-utilities
      - testing/test-modules
      - data/index
      - data/sql
      - data/nosql
  ingestion:
    max-words-per-chunk: 200
