  - id: lazy-connection-fetch
    category: configuration
    expect: answer
    traits: []
    question: Can Boot make my pooled DataSource hold off fetching a JDBC connection until a statement is actually executed?
    expectedSources:
      - data.sql.datasource.lazy-connection
    expectedText:
      - 'by setting `spring.datasource.connection-fetch` to `lazy`'
    keyPoints:
      - Set spring.datasource.connection-fetch to lazy
      - Transaction control then happens without fetching a connection; the connection is fetched when the first JDBC Statement is created
      - Use DataSource.unwrap to reach the target auto-configured DataSource

  - id: r2dbc-keeps-jdbc-datasource
