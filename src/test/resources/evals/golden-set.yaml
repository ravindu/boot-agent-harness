  - id: rest-client-test-full-uri
    category: how-to
    expect: answer
    traits: [deep-detail]
    question: In my @RestClientTest, server.expect(requestTo("/greet/details")) never matches. My service builds its client from RestClient.Builder with a base URL. What's wrong?
    expectedSources:
      - testing.spring-boot-applications.autoconfigured-rest-client
    expectedText:
      - 'the full URI must be used in the `MockRestServiceServer` expectations'
    keyPoints:
      - With a RestClient.Builder, the full URI must be used in the MockRestServiceServer expectations
