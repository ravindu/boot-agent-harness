    keyPoints:
      - Use @AutoConfigureTestDatabase(replace = Replace.NONE) so the DataSource isn't replaced with an embedded database
      - Declare the PostgreSQLContainer as a static @Container field (in a @Testcontainers test) annotated with @ServiceConnection
      - spring-boot-testcontainers must be a test dependency

