  - id: test-configuration-ordering
    category: concept
    expect: answer
    traits: [deep-detail]
    question: I have an imported top-level @TestConfiguration and a nested @TestConfiguration that both define a bean. Which one is processed first, and does it matter?
    expectedSources:
      - testing.spring-boot-applications.excluding-configuration
    expectedText:
      - 'An imported `@TestConfiguration` is processed earlier than an inner-class `@TestConfiguration`'
    keyPoints:
      - An imported @TestConfiguration is processed earlier than an inner-class @TestConfiguration
      - An imported @TestConfiguration is processed before configuration found through component scanning
      - The ordering usually has no noticeable effect, but it matters if you rely on bean overriding

  - id: jpa-deferred-bootstrap
    category: configuration
    expect: answer
    traits: [paraphrased, deep-detail, multi-hop]
    question: How can I make Spring Data JPA repositories bootstrap in the background to speed up startup, and what do I need to be careful about?
    expectedSources:
      - data.sql.jpa-and-spring-data.repositories
    expectedText:
      - 'set the `spring.data.jpa.repositories.bootstrap-mode` property to `deferred` or `lazy`'
      - 'You can use `SmartInitializingSingleton` to invoke any initialization that requires the JPA infrastructure.'
    keyPoints:
      - Set spring.data.jpa.repositories.bootstrap-mode to deferred (or lazy)
      - Deferred bootstrapping uses the context's AsyncTaskExecutor, the one named applicationTaskExecutor if there are several
      - Defer any access to the JPA infrastructure until after the context bootstrap, e.g. with SmartInitializingSingleton

