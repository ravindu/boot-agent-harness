  - id: config-data-initializer-value
    category: concept
    expect: answer
    traits: [deep-detail]
    question: I load application.properties in a plain Spring test with ConfigDataApplicationContextInitializer, but my @Value("${...}") fields stay unresolved. Why?
    expectedSources:
      - testing.utilities.config-data-application-context-initializer
    expectedText:
