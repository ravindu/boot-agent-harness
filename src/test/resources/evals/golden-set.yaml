    expectedText:
      - 'add `@Import(DataSourceAutoConfiguration.class)` on a `@Configuration` class'
    keyPoints:
      - When a ConnectionFactory bean is available, the JDBC DataSource auto-configuration backs off
      - Re-enable it with @Import(DataSourceAutoConfiguration.class) on a @Configuration class

