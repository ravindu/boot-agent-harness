  # ---------------------------------------------------------------------------
  # REST CLIENTS (ANSWERABLE)
  # ---------------------------------------------------------------------------

  - id: rest-client-test-slice
    category: how-to
    expect: answer
    traits: []
    question: Which test annotation should I use if I want to test my outbound HTTP client calls using MockRestServiceServer?
    expectedSources:
      - testing.spring-boot-applications.autoconfigured-rest-client
    expectedText:
      - 'use the `@RestClientTest` annotation from the `spring-boot-restclient-test` module'
    keyPoints:
      - Use @RestClientTest, from the spring-boot-restclient-test module in Boot 4
      - It auto-configures Jackson, GSON and Jsonb support, a RestTemplateBuilder and a RestClient.Builder, and adds MockRestServiceServer support
      - Specify the beans under test with the value or components attribute; regular @Component and @ConfigurationProperties beans are not scanned

  # ===========================================================================
  # DRAFT CANDIDATES (Claude Code, 2026-10-20): NOT YET REVIEWED BY THE OWNER
  #
  # Written from the ingested Boot 4.1.1 chunk text only (no agent runs looked at), so they can
  # still serve as a held-out set. Review each one: keep, fix or delete. Every expectedText was
  # checked to occur in exactly one ingested chunk. "OWNER CHECK" comments mark known doubts.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Single section: caveats, notes, details past the first chunk, near-miss passages
  # ---------------------------------------------------------------------------

  - id: transactional-random-port-no-rollback
    category: concept
    expect: answer
    traits: [deep-detail]
    question: My @Transactional @SpringBootTest calls the app over HTTP on a random port, but the rows the request inserts are still there after the test. Why isn't it rolled back?
    expectedSources:
      - testing.spring-boot-applications
    expectedText:
      - 'the HTTP client and server run in separate threads and, thus, in separate transactions'
    keyPoints:
      - With RANDOM_PORT (or DEFINED_PORT) the HTTP client and the server run in separate threads, and so in separate transactions
      - A transaction started on the server is not rolled back at the end of the test

  - id: data-r2dbc-test-not-transactional
    category: concept
    expect: answer
    traits: [distractor]
    question: Do @DataR2dbcTest tests roll back their database changes after each test, like @DataJpaTest does?
    expectedSources:
      - testing.spring-boot-applications.autoconfigured-spring-data-r2dbc
    expectedText:
      - 'By default, Data R2DBC tests are not transactional.'
    keyPoints:
      - No; by default Data R2DBC tests are not transactional, so changes are not rolled back automatically
    mustNotSay:
      - That @DataR2dbcTest tests are transactional and roll back at the end of each test by default

  - id: data-jpa-show-sql
    category: configuration
    expect: answer
    traits: []
    question: My @DataJpaTest output is flooded with SQL statements even though I never enabled SQL logging. Where does that come from and how do I turn it off?
    expectedSources:
      - testing.spring-boot-applications.autoconfigured-spring-data-jpa
    expectedText:
      - 'This can be disabled using the `showSql` attribute of the annotation.'
    keyPoints:
      - "@DataJpaTest logs SQL by default by setting spring.jpa.show-sql to true"
      - Turn it off with the showSql attribute of @DataJpaTest (showSql = false)

  - id: test-entity-manager-outside-slice
    category: how-to
    expect: answer
    traits: [deep-detail]
    question: Can I use TestEntityManager in a full @SpringBootTest instead of a @DataJpaTest?
    expectedSources:
      - testing.spring-boot-applications.autoconfigured-spring-data-jpa
    expectedText:
      - '`TestEntityManager` can also be auto-configured to any of your Spring-based test class by adding `@AutoConfigureTestEntityManager`.'
    keyPoints:
      - Yes, add @AutoConfigureTestEntityManager to the test class
      - The test must run in a transaction, for example by adding @Transactional to the test class or method

  - id: slice-extra-autoconfiguration
    category: how-to
    expect: answer
    traits: []
    question: My @JdbcTest needs one more auto-configuration class that the slice doesn't load. How do I add it to one test, and how do I add it to every @JdbcTest at once?
    expectedSources:
      - testing.spring-boot-applications.additional-autoconfiguration-and-slicing
    expectedText:
      - 'by adding `@ImportAutoConfiguration` to the test'
    keyPoints:
      - For one test, add @ImportAutoConfiguration with the auto-configuration class to the test (or create a custom @AutoConfigure... annotation)
      - For every @JdbcTest, list the class in META-INF/spring/org.springframework.boot.jdbc.test.autoconfigure.JdbcTest.imports
    mustNotSay:
      - Importing the auto-configuration class with the regular @Import annotation

  - id: multiple-slices-one-test
    category: concept
    expect: answer
    traits: [paraphrased, deep-detail]
    question: Can I put both @WebMvcTest and @DataJpaTest on one test class to test my controller and repository together?
    expectedSources:
      - testing.spring-boot-applications.autoconfigured-tests
    expectedText:
      - 'Including multiple "slices" by using several `@...Test` annotations in one test is not supported.'
    keyPoints:
      - Using several @...Test slice annotations on one test is not supported
      - Pick one @...Test annotation and add the @AutoConfigure... annotations of the other slice by hand
    mustNotSay:
      - That combining @WebMvcTest and @DataJpaTest on one class works

  - id: use-main-method
    category: configuration
    expect: answer
    traits: [deep-detail]
    question: My main method sets extra profiles before calling SpringApplication.run, but my @SpringBootTest doesn't get those profiles. How do I make the test start the app through main?
    expectedSources:
      - testing.spring-boot-applications.using-main
    expectedText:
      - 'change the `useMainMethod` attribute of `@SpringBootTest`'
    keyPoints:
      - By default @SpringBootTest does not call the main method; it uses the class directly to create the ApplicationContext
      - Set useMainMethod on @SpringBootTest to UseMainMethod.ALWAYS or UseMainMethod.WHEN_AVAILABLE
      - ALWAYS fails the test if no main method is found; WHEN_AVAILABLE falls back to the standard loading

  - id: metrics-in-integration-tests
    category: concept
    expect: answer
    traits: []
    question: My @SpringBootTest doesn't export any metrics to our monitoring backend even though the registry is on the classpath. Is that on purpose, and how do I enable it?
    expectedSources:
      - testing.spring-boot-applications.metrics
    expectedText:
      - 'meter registries, except the in-memory backed, are not auto-configured when using `@SpringBootTest`'
    keyPoints:
      - With @SpringBootTest, meter registries other than the in-memory one are not auto-configured, regardless of the classpath
      - Annotate the test with @AutoConfigureMetrics to export metrics to a backend
      - In a sliced test, @AutoConfigureMetrics only gives an in-memory MeterRegistry; exporting is not supported there

  - id: webflux-test-security-chain
    category: how-to
    expect: answer
    traits: [deep-detail]
    question: My @WebFluxTest ignores the SecurityWebFilterChain bean from my security config. How do I get it into the test?
    expectedSources:
      - testing.spring-boot-applications.spring-webflux-tests
    expectedText:
      - '`@WebFluxTest` cannot detect custom security configuration registered as a `@Bean` of type `SecurityWebFilterChain`.'
    keyPoints:
      - "@WebFluxTest cannot detect a SecurityWebFilterChain registered as a @Bean"
      - Import the configuration that registers the bean with @Import, or use @SpringBootTest

  - id: webmvc-test-skips-configuration-beans
    category: concept
    expect: answer
    traits: [deep-detail]
    question: A WebMvcConfigurer that I declare as a @Bean in one of my @Configuration classes is not applied in my @WebMvcTest. Why, and how do I fix it?
    expectedSources:
      - testing.spring-boot-applications.user-configuration-and-slicing
    expectedText:
      - 'Test slices exclude `@Configuration` classes from scanning.'
    keyPoints:
      - Test slices exclude @Configuration classes from scanning, so a WebMvcConfigurer @Bean inside one is not loaded
      - Declaring the WebMvcConfigurer as a @Component makes the slice load it (or import the configuration class with @Import)

  - id: service-connection-custom-image
    category: how-to
    expect: answer
    traits: [deep-detail, boot3-habit]
    question: We pull Redis from our own mirror (registry.mycompany.com/mirror/myredis), and @ServiceConnection on that container creates no Redis connection details. How do I make it work?
    expectedSources:
      - testing.testcontainers.service-connections
    expectedText:
      - 'If you are using the Docker image `registry.mycompany.com/mirror/myredis`'
    keyPoints:
      - By default the repository part of the Docker image name is used to find the connection details, so a custom image name doesn't match
      - Use the name attribute, @ServiceConnection(name = "redis"), so that DataRedisConnectionDetails are created
    mustNotSay:
      - RedisConnectionDetails as the Boot 4 type name (Boot 4 uses DataRedisConnectionDetails)

  - id: service-connection-subset-types
    category: configuration
    expect: answer
    traits: [deep-detail]
    question: A PostgreSQLContainer with @ServiceConnection gives me both JDBC and R2DBC connection details, but I only want JDBC. How do I limit it?
    expectedSources:
      - testing.testcontainers.service-connections
    expectedText:
      - 'If you want to create only a subset of the applicable types, you can use the `type` attribute of `@ServiceConnection`.'
    keyPoints:
      - By default every applicable connection details bean is created; a PostgreSQLContainer creates both JdbcConnectionDetails and R2dbcConnectionDetails
      - Use the type attribute of @ServiceConnection to create only a subset (e.g. JdbcConnectionDetails)

  - id: testcontainers-ssl-client-side
    category: concept
    expect: answer
    traits: []
    question: If I put @PemKeyStore and @PemTrustStore on my Redis Testcontainer, does Spring Boot also turn on TLS inside the Redis server?
    expectedSources:
      - testing.testcontainers.service-connections.ssl
    expectedText:
      - 'the annotations only configure SSL on the client side in your application'
    keyPoints:
      - No; the SSL annotations only configure SSL on the client side in the application
      - You have to enable SSL in the service running in the container yourself (the docs' example uses a custom RedisContainer subclass)

