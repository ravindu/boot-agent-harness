  # Several chunks, wrong premises, Boot 3 habits, partial coverage
  # ---------------------------------------------------------------------------

  - id: component-scan-breaks-slices
    category: concept
    expect: answer
    traits: [deep-detail]
    question: Since I added @ComponentScan({"com.example.app", "com.example.another"}) to my main application class, my @DataJpaTest loads my services and configuration too. Why, and how do I fix it?
    expectedSources:
      - testing.spring-boot-applications.user-configuration-and-slicing
      - testing.spring-boot-applications.detecting-configuration
    expectedText:
      - 'Doing so effectively overrides the default component scan directive'
    keyPoints:
      - An explicit @ComponentScan on the @SpringBootApplication class overrides the default component scan, so those packages are scanned regardless of the slice
      - Fix it by moving the custom @ComponentScan to a separate class
      - If that's not possible, create a @SpringBootConfiguration somewhere in the test hierarchy, or specify a source for the test

  - id: testcontainers-cached-context-stopped
    category: concept
    expect: answer
    traits: [paraphrased, deep-detail]
    question: My first test class with a static @Container database works, but the next test class that reuses the same cached Spring context fails with connection errors. What's happening and what's the recommended setup?
    expectedSources:
      - testing.testcontainers.junit-extension
      - testing.testcontainers.lifecycle
    expectedText:
      - 'container instances are stopped after the test class has run (for static fields)'
    keyPoints:
      - With the Testcontainers JUnit extension, a static container is stopped after its test class has run
      - Spring's TestContext Framework can cache the ApplicationContext and reuse it in another test class, where its beans still point at the stopped container
      - Prefer managing containers as Spring beans, or importing container declarations (@ImportTestcontainers), so they live as long as the cached context

  - id: service-connection-generic-container-bean
    category: how-to
    expect: answer
    traits: [deep-detail]
    question: I declare Redis as a @Bean method returning GenericContainer<?> and annotate it with @ServiceConnection, but no Redis connection details are created. What's wrong?
    expectedSources:
      - testing.testcontainers.service-connections
    expectedText:
      - 'Spring Boot can''t tell from `GenericContainer` which container image is used'
    keyPoints:
      - For a @Bean method, Spring Boot doesn't call the method to get the image name; it uses the method's return type to pick the connection details
      - A GenericContainer return type doesn't tell Spring Boot which service it is
      - Add the hint with @ServiceConnection(name = "redis")

  - id: rabbit-streams-service-connection
    category: configuration
    expect: answer
    traits: [deep-detail]
    question: Can a RabbitMQContainer with @ServiceConnection also give my app RabbitMQ Streams connection details?
    expectedSources:
      - testing.testcontainers.service-connections
    expectedText:
      - 'The container must also expose port 5552, or port 5551 when SSL is configured, for RabbitMQ Streams.'
    keyPoints:
      - RabbitStreamConnectionDetails are not created by default
      - Opt in with the type attribute of @ServiceConnection including RabbitStreamConnectionDetails
      - The container must expose port 5552, or 5551 when SSL is configured

  - id: service-connection-vs-dynamic-properties
    category: concept
    expect: answer
    traits: [multi-hop]
    question: For a Neo4j Testcontainer, should I use @ServiceConnection or @DynamicPropertySource, and what does each one actually do?
    expectedSources:
      - testing.testcontainers.service-connections
      - testing.testcontainers.dynamic-properties
    expectedText:
      - 'This is done by automatically defining a `Neo4jConnectionDetails` bean'
      - 'A slightly more verbose but also more flexible alternative to service connections'
    keyPoints:
      - "@ServiceConnection defines a Neo4jConnectionDetails bean that the Neo4j auto-configuration uses, overriding connection-related properties"
      - "@DynamicPropertySource is a static method that adds property values to the Spring Environment through a DynamicPropertyRegistry (e.g. spring.neo4j.uri from getBoltUrl)"
      - "@DynamicPropertySource is the more verbose but more flexible alternative"

  - id: data-jpa-test-with-testcontainers
    category: how-to
    expect: answer
    traits: [deep-detail, table-or-code, multi-hop]
    # OWNER CHECK: Boot 3.4+ made @AutoConfigureTestDatabase's default replace = NON_TEST, which should not replace a
    # @ServiceConnection DataSource. The ingested docs don't mention that; keep key point 1 only if Boot 4 still needs NONE.
    question: How do I make a @DataJpaTest run against a PostgreSQL Testcontainer instead of an embedded database?
    expectedSources:
      - testing.spring-boot-applications.autoconfigured-spring-data-jpa
      - testing.testcontainers.service-connections
    expectedText:
      - '@AutoConfigureTestDatabase(replace = Replace.NONE)'
