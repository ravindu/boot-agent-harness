# Local development infrastructure. Start with: docker-compose up -d
# Port 5433 so it can run next to other local PostgreSQL containers on 5432.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: docsagent
      POSTGRES_USER: docsagent
      POSTGRES_PASSWORD: docsagent
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsagent -d docsagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
